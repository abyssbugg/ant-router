name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Quality and cross-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go version
      - run: make verify
      - run: make config-test
      - run: make config-race
      - run: make fault-test
      - run: make control-test
      - run: make control-race
      - run: make control-fault

  platform-tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go version
      - run: go test ./...
      - if: runner.os == 'macOS'
        run: go test ./internal/controltransport -run 'TestUnix|TestResolveLocal' -count=20
      - if: runner.os == 'Windows'
        run: go test ./internal/controltransport -run 'TestWindows' -count=20

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make fuzz-smoke FUZZ_TIME=10s
      - run: make control-fuzz FUZZ_TIME=10s
