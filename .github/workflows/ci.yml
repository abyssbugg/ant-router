name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Quality and cross-builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go version
      - run: make verify
      - run: make config-test
      - run: make config-race
      - run: make fault-test
      - run: make control-test
      - run: make control-race
      - run: make control-fault
      - run: make configservice-test
      - run: make configservice-race
      - run: make cli-test
      - run: make cli-race
      - run: make phase1c-fault
      - run: make phase1c-e2e
      - run: make canonical-test
      - run: make canonical-race
      - run: make canonical-golden
      - run: make canonical-stress
      - run: make streaming-test
      - run: make streaming-race
      - run: make streaming-golden
      - run: make streaming-stress
      - run: make phase3a-ci

  platform-tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go version
      - run: go test ./...
      - if: runner.os == 'macOS'
        run: go test ./internal/controltransport -run 'TestUnix|TestResolveLocal' -count=20
      - if: runner.os == 'Windows'
        run: go test ./internal/controltransport -run 'TestWindows' -count=20
      - run: make phase1c-e2e
      - run: go test ./internal/canonical ./internal/canonicaljson -count=20
      - run: go test ./internal/streaming -count=20
      - run: go test ./internal/dataplane -run TestOfficialOpenAISDKModelsAndResponses -count=20
      - run: go test -tags=e2e ./test/e2e -run TestMockResponsesSubprocessWorkflow -count=3 -timeout=5m

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make fuzz-smoke FUZZ_TIME=10s
      - run: make control-fuzz FUZZ_TIME=10s
      - run: make phase1c-fuzz FUZZ_TIME=10s
      - run: make canonical-fuzz FUZZ_TIME=10s
      - run: make streaming-fuzz FUZZ_TIME=10s
      - run: make phase3a-fuzz FUZZ_TIME=10s
